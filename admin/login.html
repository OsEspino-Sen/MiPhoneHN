<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EDEEF0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso — Mi Phone HN | Panel Administrativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOADER DE ENTRADA -->
  <div id="admin-loader" class="admin-loader admin-loader--login">
    <div class="admin-loader-inner">
      <span class="admin-loader-mark"></span>
      <span class="admin-loader-brand">Mi Phone HN</span>
      <span class="admin-loader-bar"></span>
    </div>
  </div>
  <script>
    (function () {
      var t0 = performance.now();
      var quitar = function () {
        var l = document.getElementById('admin-loader');
        if (!l || l.dataset.done) return;
        l.dataset.done = '1';
        l.classList.add('admin-loader--done');
        setTimeout(function () { l.remove(); }, 600);
      };
      var programar = function () { setTimeout(quitar, Math.max(0, 600 - (performance.now() - t0))); };
      if (document.readyState === 'complete') programar();
      else window.addEventListener('load', programar);
      setTimeout(quitar, 3000);
    })();
  </script>

  <section id="login-screen" class="login-screen">
    <div class="login-outer">
      <!-- Left: Image -->
      <div class="login-visual" aria-hidden="true">
        <div class="login-image-wrapper" id="login-image-wrapper">
          <img id="login-custom-image" src="imagen-login.jpeg" alt="Visual administracion" loading="eager">
          <div class="login-image-placeholder" id="login-image-placeholder">
            <span class="placeholder-icon"><i class="ph ph-image" aria-hidden="true"></i></span>
            <strong>Tu imagen 3D aquí</strong>
            <span>Coloca un archivo llamado <code>imagen-login.jpg</code> en la carpeta principal</span>
          </div>
        </div>
      </div>

      <!-- Right: Form -->
      <div class="login-shell">
        <div class="login-card">
          <div class="login-brand">
            <span class="login-brand-mark"></span>
            <span class="login-brand-text">Mi Phone <b>HN</b></span>
          </div>

          <div class="login-heading">
            <span class="eyebrow"><i></i> Panel administrativo — acceso seguro</span>
            <h1>Bienvenido de nuevo</h1>
            <p>Ingresa para administrar tu catálogo centralizado.</p>
          </div>

          <form id="admin-login-form" class="login-form">
            <div class="form-group">
              <label for="email">Correo administrativo</label>
              <div class="input-with-icon">
                <span class="input-icon"><i class="ph ph-envelope-simple" aria-hidden="true"></i></span>
                <input type="email" id="email" autocomplete="username" required placeholder="admin@miphonehn.com">
              </div>
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="input-with-icon">
                <span class="input-icon"><i class="ph ph-lock" aria-hidden="true"></i></span>
                <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
              </div>
            </div>

            <p id="error-message" class="form-error" role="alert" hidden></p>

            <button type="submit" class="btn btn-primary btn-block">
              <span>Entrar al panel</span>
              <i class="ph ph-arrow-right" aria-hidden="true"></i>
            </button>
          </form>

          <div class="login-footer">
            <span class="secure-note"><i class="ph ph-shield-check" aria-hidden="true"></i> Sesión protegida</span>
            <a href="https://miphonehn.vercel.app/" class="back-link">Ver tienda <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    (() => {
      const wrapper = document.getElementById('login-image-wrapper');
      const img = document.getElementById('login-custom-image');
      const placeholder = document.getElementById('login-image-placeholder');
      if (!wrapper || !img) return;

      // Primer intento: leer desde Supabase
      import('./supabase-config.js').then(async ({ db, collection, getDocs, getDoc, doc }) => {
        try {
          // Primer intento: leer desde Supabase (nueva key, con fallback a la legacy)
          const docSnap = await getDoc(doc(db, 'imagenes', 'imagen_login'));
          const docSnapLegacy = docSnap.exists() ? null : await getDoc(doc(db, 'imagenes', 'login'));
          const docData = docSnap.exists() ? docSnap.data() : (docSnapLegacy && docSnapLegacy.exists() ? docSnapLegacy.data() : null);
          const loginSrc = docData ? (docData.data || docData.url) : null;
          if (loginSrc) {
            img.src = loginSrc;
            img.style.opacity = '1';
            wrapper.classList.add('has-image');
            if (placeholder) placeholder.style.display = 'none';
            return;
          }
        } catch (_) {}
        startLocalFallback();
      }).catch(() => startLocalFallback());

      function startLocalFallback() {
        const candidates = [
          'imagen-login.jpg','imagen-login.png','imagen-login.webp','imagen-login.jpeg',
          'imagen-login.JPG','imagen-login.PNG',
          'custom-image.jpg','custom-image.png',
          'login-3d.jpg','login-3d.png',
          'uploads/imagen-login.jpg',
          'image.png'
        ];
        let i = 0;
        const tryNext = () => {
          if (i >= candidates.length) {
            wrapper.classList.remove('has-image');
            if (placeholder) placeholder.style.display = 'flex';
            return;
          }
          const src = candidates[i++];
          const test = new Image();
          test.onload = () => {
            img.src = src;
            img.style.opacity = '1';
            wrapper.classList.add('has-image');
            if (placeholder) placeholder.style.display = 'none';
          };
          test.onerror = tryNext;
          test.src = src + '?t=' + Date.now();
        };
        tryNext();
      }
      wrapper.addEventListener('dragover', e => { e.preventDefault(); wrapper.style.outline = '2px dashed #2440E8'; });
      wrapper.addEventListener('dragleave', () => { wrapper.style.outline = ''; });
      wrapper.addEventListener('drop', e => {
        e.preventDefault(); wrapper.style.outline = '';
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          const url = URL.createObjectURL(file);
          img.src = url;
          wrapper.classList.add('has-image');
          if (placeholder) placeholder.style.display = 'none';
        }
      });
    })();
  </script>
  <script type="module">
    import { auth, signInWithEmailAndPassword, syncUserToSupabase, db, doc, getDoc } from './supabase-config.js';

    // Logotipo oficial y NOMBRE DE LA EMPRESA en la pantalla de acceso.
    // Única fuente de verdad: la BD (configuracion/empresa), igual que el
    // panel y el sitio público. Sin valores fijos ni separados.
    (async () => {
      const MARCA_LOGIN = 'Mi Phone HN';
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const marcaHTML = (nombre) => {
        const palabras = String(nombre).trim().split(/\s+/).filter(Boolean);
        if (!palabras.length) return '';
        const ultima = palabras.pop();
        const resto = palabras.join(' ');
        return resto ? `${esc(resto)} <b>${esc(ultima)}</b>` : `<b>${esc(ultima)}</b>`;
      };
      try {
        const snap = await getDoc(doc(db, 'configuracion', 'empresa'));
        const nombre = snap.exists() ? String(snap.data()?.name || '').trim() : '';
        if (nombre && nombre !== MARCA_LOGIN) {
          document.title = document.title.split(MARCA_LOGIN).join(nombre);
          const texto = document.querySelector('.login-brand-text');
          if (texto) texto.innerHTML = marcaHTML(nombre);
          document.querySelectorAll('[aria-label]').forEach((el) => {
            const v = el.getAttribute('aria-label');
            if (v && v.includes(MARCA_LOGIN)) el.setAttribute('aria-label', v.split(MARCA_LOGIN).join(nombre));
          });
        }
        // Nombre confirmado (real de la BD, o el por defecto si la red falló):
        // recién aquí se hace visible la marca, sin swap a mitad de pantalla.
        const nombreFinal = (document.querySelector('.login-brand-text')?.textContent || MARCA_LOGIN).trim();
        const marcaVisible = document.querySelector('.login-brand-text');
        if (marcaVisible) marcaVisible.classList.add('marca-confirmada');
        const loaderBrand = document.querySelector('.admin-loader-brand');
        if (loaderBrand) {
          loaderBrand.textContent = nombreFinal;
          loaderBrand.classList.add('marca-confirmada');
        }
      } catch (_) {
        const marcaVisible = document.querySelector('.login-brand-text');
        if (marcaVisible) marcaVisible.classList.add('marca-confirmada');
        const loaderBrand = document.querySelector('.admin-loader-brand');
        if (loaderBrand) loaderBrand.classList.add('marca-confirmada');
      }
      try {
        const snap = await getDoc(doc(db, 'imagenes', 'logo'));
        const data = snap.exists() ? snap.data() : null;
        const url = data?.url || data?.data;
        if (!url) return;
        const src = url.startsWith('data:') ? url : url + '?t=' + Date.now();
        const mark = document.querySelector('.login-brand-mark');
        if (mark) {
          const texto = document.querySelector('.login-brand-text');
          const nombreActual = (texto?.textContent || MARCA_LOGIN).trim();
          mark.innerHTML = `<img src="${src}" alt="${esc(nombreActual)}" class="brand-logo-img">`;
          mark.classList.add('has-logo');
        }
        const loaderMark = document.querySelector('#admin-loader .admin-loader-mark');
        if (loaderMark && !loaderMark.classList.contains('has-logo')) {
          loaderMark.innerHTML = `<img src="${src}" alt="" class="admin-loader-logo">`;
          loaderMark.classList.add('has-logo');
        }
      } catch (_) {}
    })();

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-message');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      try {
        errorEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = "<span>Validando acceso…</span>";

        // Solo inicio de sesión: no se crean cuentas automáticamente desde el login.
        // La creación de administradores debe realizarse desde el panel o la consola de Supabase.
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        const user = userCred.user;
        await syncUserToSupabase(user);
        sessionStorage.setItem('miphone_bienvenida', '1');
        window.location.href = 'index.html';

      } catch (err) {
        let msg = err.message || 'Credenciales no válidas.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          msg = 'Correo o contraseña incorrectos. Si no tienes cuenta, contacta al administrador del sistema.';
        }
        errorEl.innerText = msg;
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Entrar al panel</span><i class=\"ph ph-arrow-right\" aria-hidden=\"true\"></i>";
      }
    });
  </script>
</body>
</html>
